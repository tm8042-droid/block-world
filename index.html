<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>블록 월드</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a8f3a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 신나는 블록 샌드박스, 아이도 바로 쓰는 큰 버튼
   IDEA: 잔디 블록 한 덩이처럼 — 위는 초록, 아래는 흙
   PICTURE: 실시간 3D 블록 섬 자체가 화면 전체
   COLOUR and TYPE: 하늘색·잔디색·흙색 / Black Han Sans 로고, Noto Sans KR UI
   LAYOUT: 전체 화면 3D, 아래 핫바, 왼쪽 조이스틱, 오른쪽 행동 버튼 */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e1b10;color:#fff;font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#cool{position:fixed;left:50%;top:calc(50% + 18px);width:22px;height:4px;transform:translateX(-50%);background:#0008;pointer-events:none;opacity:0}#cool i{display:block;height:100%;background:#fff;width:0}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none;opacity:.9}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px #0006}
#cross::before{left:10px;top:0;width:2px;height:22px}#cross::after{top:10px;left:0;height:2px;width:22px}
#bar{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:3px;padding:4px;background:#000a;border:2px solid #000;border-radius:6px;box-shadow:inset 0 0 0 2px #ffffff22}
.slot{width:clamp(34px,9vw,50px);aspect-ratio:1;border:2px solid #ffffff30;border-radius:3px;background:#ffffff10;display:grid;place-items:center;padding:2px;cursor:pointer;touch-action:none}
.slot.on{border-color:#fff;background:#ffffff38;box-shadow:0 0 0 2px #000,0 0 10px #fff8}
.slot{position:relative}.slot .cnt{position:absolute;right:2px;bottom:0;font:700 12px/1 "Noto Sans KR",sans-serif;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}.slot.empty canvas{opacity:.35}
.slot canvas{width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
#name{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);font-weight:700;font-size:16px;text-shadow:0 2px 0 #000,0 0 6px #000;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#tip{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#000b;padding:6px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.touch-only{display:none}
body.touch .touch-only{display:block}
#boatPad{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(74px + env(safe-area-inset-bottom));display:none;grid-template-columns:repeat(3,64px);grid-template-rows:64px 64px;grid-template-areas:". u ." "l d r";gap:6px}
body.touch.riding #boatPad{display:grid}body.touch.riding #joy{display:none!important}
.bp{border-radius:14px;border:2px solid #ffffff80;background:#5a3d1fcc;color:#fff;font:700 20px/1 "Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:none;padding:0}.bp small{font-size:11px}.bp.on{background:#a8743acc}
#joy{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(78px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff38;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#ffffff48;border:2px solid #fffa}
#btns{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(78px + env(safe-area-inset-bottom))}
body.touch #btns{display:grid}
#btns{grid-template-columns:repeat(2,66px);grid-template-areas:"fly dn" "brk jmp" "plc jmp";gap:10px}
.b{width:66px;height:66px;border-radius:50%;border:2px solid #ffffff70;background:#00000066;color:#fff;font:700 14px "Noto Sans KR",sans-serif;touch-action:none;padding:0}
.b.on{background:#ffffff40}
#bJ{grid-area:jmp;height:142px;border-radius:33px}#bBr{grid-area:brk;background:#7a2a2299}#bPl{grid-area:plc;background:#24485e99}#bFly{grid-area:fly}#bDn{grid-area:dn;visibility:hidden}
body.flying #bDn{visibility:visible}
body.flying #bFly{background:#f2b33a99}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;gap:8px}
.tb{min-width:46px;height:46px;border-radius:10px;border:2px solid #ffffff60;background:#00000070;color:#fff;font:700 14px "Noto Sans KR",sans-serif;padding:0 12px;cursor:pointer}
/* ===== 조이콘 배치 (터치) ===== */
body.touch{--jb:calc(132px + env(safe-area-inset-bottom));--dp:42px;--js:128px;--fb:50px}
.jc{position:fixed;pointer-events:none;border-radius:34px;display:none}
#jcL{left:calc(8px + env(safe-area-inset-left));bottom:calc(var(--jb) - 10px);width:calc(var(--dp)*3 + 28px);height:calc(var(--dp)*3 + var(--js) + 34px);background:#00b4e626;border:2px solid #00c3f080}
#jcR{right:calc(8px + env(safe-area-inset-right));bottom:calc(var(--jb) - 10px);width:calc(var(--fb)*3 + 20px);height:calc(var(--fb)*3 + var(--js) + 34px);background:#ff4b5026;border:2px solid #ff5a5f80}
body.touch #joy{left:calc(14px + env(safe-area-inset-left) + (var(--dp)*3 + 16px - var(--js))/2);bottom:var(--jb);width:var(--js);height:var(--js)}
#joyR{position:fixed;right:calc(18px + env(safe-area-inset-right) + (var(--fb)*3 - var(--js))/2);bottom:var(--jb);width:var(--js);height:var(--js);border-radius:50%;background:#ffffff12;border:2px solid #ffffff38;pointer-events:none}
#knobR{position:absolute;left:50%;top:50%;width:calc(var(--js)*.4);height:calc(var(--js)*.4);margin:calc(var(--js)*-.2);border-radius:50%;background:#ffffff48;border:2px solid #fffa}
#joyR::after{content:"화면";position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:10px;opacity:.6}
#dpad{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(var(--jb) + var(--js) + 12px);display:none;grid-template-columns:repeat(3,var(--dp));grid-template-rows:repeat(3,var(--dp));grid-template-areas:". u ." "l . r" ". d ."}
body.touch #dpad{display:grid}
#dpad .d{width:var(--dp);height:var(--dp);border-radius:50%;border:2px solid #ffffff80;background:#1a1a1acc;color:#fff;font:700 11px/1.05 "Noto Sans KR",sans-serif;padding:0;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
#dpad .d::before{content:attr(data-a);font-size:10px;opacity:.75}
#dpad .d.on,#dpad .d:active{background:#ffffff55}
#dU{grid-area:u}#dL{grid-area:l}#dR{grid-area:r}
#dpad #bDn{grid-area:d;visibility:visible;opacity:.4;width:var(--dp);height:var(--dp);font-size:11px}
body.flying #dpad #bDn,body.gliding #dpad #bDn{opacity:1;background:#f2b33a99}
body.touch #btns{right:calc(18px + env(safe-area-inset-right));bottom:calc(var(--jb) + var(--js) + 12px);grid-template-columns:repeat(3,var(--fb));grid-template-rows:repeat(3,var(--fb));grid-template-areas:". x ." "y . a" ". b .";gap:0}
body.touch #btns .b{width:var(--fb);height:var(--fb);border-radius:50%;font-size:12px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a1acc}
#btns .b::before{content:attr(data-k);font:400 17px/1 "Black Han Sans",sans-serif;margin-bottom:1px}
body.touch #bFly{grid-area:x}body.touch #bBr{grid-area:y;background:#7a2a22cc}body.touch #bJ{grid-area:a;height:var(--fb);border-radius:50%}body.touch #bPl{grid-area:b;background:#24485ecc}
body.touch.flying #bFly,body.touch.gliding #bFly{background:#f2b33acc}
body.touch #top{display:none}
body.touch #btns #bPet{position:absolute;display:none;left:calc(var(--fb)*-1.2);top:calc(var(--fb)*2.1);background:#a8406acc}
body.touch.haspet #btns #bPet{display:flex}
#petHud{position:fixed;left:0;top:0;pointer-events:none;z-index:1}#petHud div{position:absolute;font:700 10px/1 system-ui,sans-serif;color:#fff;text-align:center;text-shadow:0 1px 0 #000,0 0 3px #000}#petHud i{display:block;height:3px;margin:2px 3px 0;background:#0009;border-radius:2px;overflow:hidden}#petHud b{display:block;height:100%;background:#8ef07a}#petHud em{font-style:normal;color:#ffe060}
#bPlus{position:fixed;display:none;z-index:1;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;border:2px solid #ffffff90;background:#1a1a1acc;color:#fff;font:700 20px/1 "Noto Sans KR",sans-serif;padding:0}
body.touch #bPlus{display:block}
body.touch #btns .b,body.touch #dpad .d{position:relative;-webkit-user-select:none;user-select:none;touch-action:none}
body.touch #btns .b::after{content:"";position:absolute;inset:-9px;border-radius:50%}
body.touch #dpad .d::after{content:"";position:absolute;inset:-9px;border-radius:50%}
#bPlus::after{content:"";position:absolute;inset:-6px;border-radius:50%}
body.touch #btns,body.touch #dpad{touch-action:none}
body.guard .ovl{pointer-events:none}
body.touch #btns .b:active,body.touch #btns .b.on,body.touch #dpad .d.on{transform:scale(.92);filter:brightness(1.35)}
body.touch #boatPad{bottom:var(--jb)}
@media (orientation:landscape) and (max-height:600px){body.touch{--jb:calc(80px + env(safe-area-inset-bottom));--dp:36px;--js:96px;--fb:40px}#jcL,#jcR{border-radius:26px}#bPlus{right:calc(env(safe-area-inset-right) + var(--fb)*3 + 70px);top:calc(8px + env(safe-area-inset-top))}}
.xbtn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:2;width:36px;height:36px;border-radius:8px;border:2px solid #1c1c1c;background:linear-gradient(#8a8a8a,#5f5f5f);box-shadow:inset 0 2px 0 #ffffff55;color:#fff;font:700 16px/1 "Noto Sans KR",sans-serif;padding:0;cursor:pointer;text-shadow:0 1px 0 #000}.xbtn:active{background:#b33a32}
.ovl{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:linear-gradient(#0a1a3066,#0a140a99)}
.ovl[hidden]{display:none}
.logo{font:400 clamp(54px,14vw,108px)/1 "Black Han Sans",sans-serif;background:linear-gradient(#9be36a 0 18%,#5fae3b 18% 40%,#8b5a34 40% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #1c140c;filter:drop-shadow(5px 5px 0 #1c140c) drop-shadow(0 8px 18px #0008);letter-spacing:3px;margin:0}
.sub{margin:0;font-weight:700;color:#fff6c8;text-shadow:0 2px 0 #000;font-size:clamp(15px,3.6vw,19px)}
.mbtn{font:700 17px "Noto Sans KR",sans-serif;min-width:240px;min-height:50px;padding:10px 24px;color:#fff;background:linear-gradient(#8a8a8a,#5f5f5f);border:3px solid #1c1c1c;box-shadow:inset 0 2px 0 #ffffff55,inset 0 -3px 0 #0005;border-radius:4px;cursor:pointer;text-shadow:0 2px 0 #000}
.mbtn.green{background:linear-gradient(#6fbf45,#3f8a2a)}
#custUI{z-index:12;background:linear-gradient(90deg,#0000 0%,#0000 34%,#0a140acc 48%);align-items:flex-end;justify-content:center;padding:14px}
#custUI .cbox{width:min(560px,64vw);max-height:calc(100% - 8px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:#000d;border:2px solid #000;border-radius:10px;box-shadow:inset 0 0 0 2px #ffffff22}
#custUI .ch{margin:0;font:400 26px "Black Han Sans",sans-serif}
.cname{display:flex;gap:8px;align-items:center;font-weight:700}.cname input{flex:1;font:700 17px "Noto Sans KR",sans-serif;padding:8px 10px;border-radius:6px;border:2px solid #1c1c1c;background:#f4f0e6;color:#222;user-select:text;-webkit-user-select:text}
.crow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;text-align:left}.crow b{width:64px;font-size:14px}
.sw{width:34px;height:34px;border-radius:6px;border:3px solid #1c1c1c;padding:0;cursor:pointer}.sw.on{border-color:#fff;box-shadow:0 0 0 2px #000}
.stb{font:700 13px "Noto Sans KR",sans-serif;padding:7px 12px;border-radius:6px;border:2px solid #1c1c1c;background:#5f5f5f;color:#fff}.stb.on{background:#3f8a2a;border-color:#fff}
#pname{position:fixed;left:10px;max-width:40vw;pointer-events:none;text-align:left;font-size:14px!important;font:700 12px "Noto Sans KR",sans-serif;color:#fff;-webkit-text-stroke:0;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (orientation:portrait){#custUI{background:linear-gradient(#0000 0%,#0000 26%,#0a140acc 36%);align-items:center;justify-content:flex-end}#custUI .cbox{width:100%;max-height:68%}}
.mbtn:focus-visible,.tb:focus-visible,.slot:focus-visible{outline:3px solid #fff;outline-offset:2px}
.help{max-width:520px;font-size:13px;color:#e6e6e6;text-shadow:0 1px 0 #000;margin:4px 0 0;line-height:1.7}
.help b{color:#fff6c8}
#inv{overflow:auto;justify-content:safe center;gap:10px}
#inv .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));width:min(100%,560px);gap:8px;padding:12px;background:#c6c6c6;border:3px solid #1c1c1c;border-radius:4px;box-shadow:inset 0 3px 0 #fff,inset 0 -3px 0 #555}
#inv .it{aspect-ratio:1;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;display:grid;place-items:center;cursor:pointer;padding:5px}
#inv .it canvas{width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
#inv h2{margin:0;font:400 clamp(20px,5vw,28px) "Black Han Sans",sans-serif;text-shadow:0 2px 0 #000}
#invName{min-height:22px;font-weight:700;text-shadow:0 2px 0 #000}
#hearts{position:fixed;left:50%;bottom:calc(14px + clamp(34px,9vw,50px) + 14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;pointer-events:none;filter:drop-shadow(0 1px 0 #000)}
#hearts svg{width:clamp(11px,2.7vw,15px);height:auto}
#hearts.shake{animation:hs .3s}
@keyframes hs{25%{transform:translate(calc(-50% - 3px),-2px)}75%{transform:translate(calc(-50% + 3px),1px)}}
#sleepFade{position:fixed;inset:0;z-index:5;background:#05040f;opacity:0;pointer-events:none;display:grid;place-items:center}#sleepFade span{font:400 clamp(26px,6vw,40px) "Black Han Sans",sans-serif;color:#cfd6ff;letter-spacing:2px}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(transparent 45%,#d0101099)}
#dead{background:#7a0e0ecc}
#dead h2{margin:0;font:400 clamp(34px,9vw,60px)/1 "Black Han Sans",sans-serif;text-shadow:0 3px 0 #000}
#craft{overflow:auto;justify-content:safe center;gap:10px;padding:16px}
#craft .ch{margin:0;font:400 clamp(22px,5vw,30px) "Black Han Sans",sans-serif;text-shadow:0 2px 0 #000}
#mats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px}
.mat{display:flex;align-items:center;gap:5px;background:#000a;border:1px solid #ffffff30;border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;font-weight:700;white-space:nowrap}
.mat canvas{width:22px;height:22px;image-rendering:pixelated}
#recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:min(100%,680px)}
.rc{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;background:#c6c6c6;color:#222;border:3px solid #1c1c1c;border-radius:4px;padding:6px;text-align:left;box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #555;cursor:pointer;font:inherit}
.rc canvas{grid-row:1/3;width:44px;height:44px;image-rendering:pixelated;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737}
.rc b{font-size:14px}.rc span{font-size:12px;color:#444}
.rc[disabled]{opacity:.45;cursor:default}
.rc:not([disabled]):hover{background:#dcdcdc}
#inv .sec{grid-column:1/-1;font-weight:700;color:#333;font-size:13px;margin-top:4px}
.mbtn.d0{background:linear-gradient(#6fb6e0,#3a7fb0)}.mbtn.d3{background:linear-gradient(#7fd06a,#3f9a3a)}.mbtn.d1{background:linear-gradient(#e2b84a,#b07f1c)}.mbtn.d2{background:linear-gradient(#d0503e,#8e2318)}
#menu,#dead,#inv,#craft{z-index:10}#menu{overflow:auto;justify-content:safe center;background:linear-gradient(#0a1a30b0,#0a140acc)}
@media (max-height:500px){.logo{font-size:44px}.sub{font-size:14px}.mbtn{min-height:42px;padding:6px 20px;font-size:15px}#menu{gap:8px;padding:12px}.help{font-size:12px;line-height:1.5}}
.rsec{grid-column:1/-1;font-weight:700;font-size:14px;text-shadow:0 1px 0 #000;margin-top:6px;text-align:left}
#armor{position:fixed;left:50%;bottom:calc(14px + clamp(34px,9vw,50px) + 30px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;pointer-events:none;filter:drop-shadow(0 1px 0 #000)}#armor svg{width:clamp(11px,2.7vw,15px);height:auto}
#inv .it.worn{border-color:#2fbf4a;box-shadow:0 0 0 2px #2fbf4a}
.ainfo{grid-column:1/-1;color:#333;font-size:13px;font-weight:700}
#slotsUI{z-index:11;overflow:auto;justify-content:safe center;gap:10px;background:linear-gradient(#0a1a30e6,#0a140af0)}
#slotsUI .ch{margin:0;font:400 clamp(22px,5vw,30px) "Black Han Sans",sans-serif;text-shadow:0 2px 0 #000}
#slotList{display:grid;gap:8px;width:min(100%,560px)}
.sl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:#c6c6c6;color:#222;border:3px solid #1c1c1c;border-radius:4px;padding:8px 10px;box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #555;text-align:left}
.sl b{font-size:15px}.sl small{grid-column:1;color:#444;font-size:12.5px}.sl .row{grid-row:1/3;grid-column:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sbtn{font:700 14px "Noto Sans KR",sans-serif;min-height:40px;padding:6px 12px;color:#fff;background:linear-gradient(#8a8a8a,#5f5f5f);border:2px solid #1c1c1c;border-radius:4px;cursor:pointer;text-shadow:0 1px 0 #000;white-space:nowrap}
.sbtn.g{background:linear-gradient(#6fbf45,#3f8a2a)}.sbtn.r{background:linear-gradient(#c9563f,#8e2318)}.sbtn.warn{background:linear-gradient(#f2b33a,#b97a10)}
.sbtn[disabled]{opacity:.4;cursor:default}
.bk{display:grid;gap:6px;width:min(100%,560px);background:#000a;border:1px solid #ffffff30;border-radius:6px;padding:10px;text-align:left}
.bk span{font-size:12.5px;color:#ddd}.bk .row{display:flex;gap:6px;flex-wrap:wrap}
#codeBox{width:100%;height:64px;font:12px/1.4 ui-monospace,monospace;background:#111;color:#cfe;border:1px solid #555;border-radius:4px;padding:6px;resize:vertical;user-select:text;-webkit-user-select:text}
@media (max-height:500px){.sl{padding:5px 8px}.sbtn{min-height:36px;padding:4px 10px}}
#mapUI{z-index:11;gap:8px;overflow:auto;justify-content:safe center;background:linear-gradient(#0a1a30e6,#0a140af0)}#mapUI .ch{margin:0;font:400 clamp(20px,5vw,28px) "Black Han Sans",sans-serif}
#mapC{width:min(86vw,62vh);aspect-ratio:1;image-rendering:pixelated;border:3px solid #1c1c1c;border-radius:4px;box-shadow:0 4px 18px #0008;background:#1c3f80}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="flash"></div>
<div id="cross"></div><div id="cool"><i></i></div>
<div id="tip"></div>
<div id="name"></div>
<div id="armor"></div>
